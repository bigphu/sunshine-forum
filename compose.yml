# Dev stack của forum: make init (một lần), rồi make up / make dev.
#   web (Vite, :5180) ──/api──► app (Go, :8091) ──► postgres (:5441)
#   worker ──► postgres, mailpit (SMTP)
# Stack riêng, mạng và cổng riêng, để chạy cạnh StoreIt trên cùng máy.
name: sunshine-forum

x-go-env: &go-env
  TZ: UTC
  PGTZ: UTC
  DB_URL: postgres://${APP_DB_USER:-sunshine}@postgres:5432/${APP_DB_NAME:-sunshine}?sslmode=disable
  PGPASSWORD_FILE: /run/secrets/pg_password
  PRIVACY_ENC_KEY_FILE: /run/secrets/privacy_enc_key
  PRIVACY_HMAC_KEY_FILE: /run/secrets/privacy_hmac_key
  IDENTITY_COOKIE_SECURE: "false"
  IDENTITY_APP_URL: http://localhost:${WEB_PORT:-5180}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LOG_FORMAT: pretty

x-go-dev: &go-dev
  build:
    context: ./backend
    target: dev
  init: true
  secrets: [pg_password, privacy_enc_key, privacy_hmac_key]
  volumes:
    - ./backend:/src
    - gomod:/go/pkg/mod
    - gobuild:/root/.cache/go-build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-sunshine}
      POSTGRES_USER: ${APP_DB_USER:-sunshine}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      TZ: UTC
    secrets: [pg_password]
    ports:
      - "127.0.0.1:${DB_PORT:-5441}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-sunshine} -d ${APP_DB_NAME:-sunshine}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Chạy migration rồi thoát; app và worker chỉ start khi migrate thành công
  migrate:
    <<: *go-dev
    command: ["go", "run", "./cmd/migrate"]
    environment: *go-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Dữ liệu demo: make seed (không chạy khi `docker compose up`)
  seed:
    <<: *go-dev
    command: ["go", "run", "./cmd/seed"]
    environment:
      <<: *go-env
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"
    profiles: ["tools"]

  app:
    <<: *go-dev
    environment:
      <<: *go-env
      HTTP_ADDR: ":8080"
      # Swagger UI: http://localhost:8091/api/docs
      HTTP_API_DOCS: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8091}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    <<: *go-dev
    command: ["air", "-c", "air.worker.toml"]
    environment:
      <<: *go-env
      MAIL_TRANSPORT: smtp
      MAIL_FROM: Sunshine Apartment <no-reply@sunshine.test>
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      MAIL_SMTP_TLS: none
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_URL: http://app:8080
      VITE_USE_POLLING: "true"
      VITE_HMR_CLIENT_PORT: ${WEB_PORT:-5180}
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5180"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  # Hộp thư dev: http://localhost:8026; SMTP 1026 trên host cho worker chạy ngoài Docker
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
      - "127.0.0.1:1026:1025"
    restart: unless-stopped

secrets:
  pg_password:
    file: ./deploy/secrets/pg_password.txt
  privacy_enc_key:
    file: ./deploy/secrets/privacy_enc_key.txt
  privacy_hmac_key:
    file: ./deploy/secrets/privacy_hmac_key.txt

volumes:
  pgdata:
  gomod:
  gobuild:
