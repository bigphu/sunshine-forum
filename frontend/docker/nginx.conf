# Một origin cho cả SPA và API: cookie phiên (SameSite=Lax) đi kèm mọi request, backend
# không cần CORS. HTTPS do reverse proxy trên host lo (deploy/nginx).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Phân giải "app" lúc chạy qua DNS của Docker: app khởi động lại (đổi IP) hay
    # chưa lên khi nginx start thì nginx vẫn chạy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://app:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Server-Sent Events: không buffer, giữ kết nối lâu
    location = /api/v1/notifications/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nối IP của bên gọi (reverse proxy trên host) vào X-Forwarded-For; app tin
        # dải mạng compose nên lần ngược ra IP client thật cho rate limit
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 2m;
    }

    # Health của cả chuỗi (nginx -> app) cho giám sát bên ngoài
    location = /healthz {
        proxy_pass $api;
    }

    # File của Vite có hash trong tên: cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Mọi route của SPA (/t/…, /kiem-duyet/…) trả index.html; không cache index.html để
    # bản deploy mới có hiệu lực ngay
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
