# CI của frontend: typecheck, test, build. Gọi từ ci.yml
name: frontend

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck, test, build
        run: npm run check

      # Kiểu API sinh từ spec của backend phải được commit cùng spec
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api
