# CI của backend: chạy đúng các make target như trên máy dev. Gọi từ ci.yml
name: backend

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Format + vet
        run: make fmt-check vet

      - name: Lint (golangci-lint + depguard boundaries)
        run: make lint

      # CI=true: test DB (testcontainers) không được bỏ qua
      - name: Test
        run: make test-db

      # Fail nếu sửa spec hay query mà chưa commit code sinh lại
      - name: Generated code is up to date
        run: make generate-check
