# CI của dịch vụ mô hình (submodule model/, repo riêng tư): test chấm điểm và hợp đồng HTTP
# bằng mô hình đồ chơi, không cần dataset. Gọi từ ci.yml, cần secret MODEL_REPO_TOKEN
name: model

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: model

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # model/ là repo riêng tư: GITHUB_TOKEN của forum không đọc được nó. MODEL_REPO_TOKEN là
      # fine-grained token chỉ đọc nội dung repo mô hình (docs/guides/deploying.md)
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.MODEL_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements-*.txt

      - name: Install
        run: pip install -r requirements-test.txt

      - name: Test
        run: pytest -q tests
