# CI của dịch vụ mô hình (submodule model/): test chấm điểm và hợp đồng HTTP bằng mô hình đồ
# chơi, không cần dataset. Gọi từ ci.yml
name: model

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: model

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements-*.txt

      - name: Install
        run: pip install -r requirements-test.txt

      - name: Test
        run: pytest -q tests
