# Live reload cho service worker trong compose.yml
root = "."
tmp_dir = "tmp/worker"

[build]
  cmd = "go build -o ./tmp/worker/worker ./cmd/worker"
  entrypoint = ["./tmp/worker/worker"]
  include_ext = ["go", "sql", "html", "txt"]
  exclude_dir = ["tmp", "bin", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  poll = true
  poll_interval = 500
  delay = 1500
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
