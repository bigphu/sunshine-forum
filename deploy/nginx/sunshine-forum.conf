# Site của forum trên host nginx (dùng chung với StoreIt). Chứng chỉ lấy bằng DNS-01 qua
# Cloudflare như StoreIt, vì Let's Encrypt không vào được cổng 80. Bản ghi DNS để
# "DNS only" để rate limit thấy IP thật của cư dân.
server {
    listen 443 ssl;
    http2 on;
    server_name sunshine-forum.bigphu.io.vn;

    ssl_certificate     /etc/letsencrypt/live/sunshine-forum.bigphu.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunshine-forum.bigphu.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # Server-Sent Events: tắt buffering và cho kết nối sống lâu, nếu không thông báo tới
    # trễ hoặc kết nối bị cắt
    location = /api/v1/notifications/stream {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name sunshine-forum.bigphu.io.vn;
    return 301 https://$host$request_uri;
}
