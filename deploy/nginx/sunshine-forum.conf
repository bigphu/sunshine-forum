# Site của forum trên host nginx (dùng chung với StoreIt). Nhà cung cấp chặn truy cập từ
# nước ngoài nên Let's Encrypt không vào được cổng 80: cert lấy bằng thử thách DNS qua plugin
# Cloudflare của certbot, dùng chung file credentials với StoreIt. Bản ghi DNS để "DNS only".
#
# Cài:
#   sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d sunshine-forum.bigphu.io.vn --deploy-hook "systemctl reload nginx"
#   sudo cp deploy/nginx/sunshine-forum.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sunshine-forum.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# certbot.timer tự gia hạn qua cùng plugin DNS.
server {
    # nginx 1.24 của Ubuntu 24.04 chưa có "http2 on;" (từ 1.25.1) nên bật trên listen, như StoreIt
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sunshine-forum.bigphu.io.vn;

    ssl_certificate     /etc/letsencrypt/live/sunshine-forum.bigphu.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunshine-forum.bigphu.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # Server-Sent Events: tắt buffering và cho kết nối sống lâu, nếu không thông báo tới
    # trễ hoặc kết nối bị cắt
    location = /api/v1/notifications/stream {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sunshine-forum.bigphu.io.vn;
    return 301 https://$host$request_uri;
}
