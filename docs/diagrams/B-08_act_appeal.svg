" stroke="#15223F" stroke-width="1.2"/><path d="M268.9,842.8 L280.0,847.6 L269.1,852.8" fill="none" stroke="#15223F" stroke-width="1.3"/><path d="M390.0,806.0 L390.0,832.0" fill="none" stroke="#15223F" stroke-width="1.2"/><path d="M395.0,821.0 L390.0,832.0 L385.0,821.0" fill="none" stroke="#15223F" stroke-width="1.3"/><path d="M280.0,868.4 L210.0,868.4" fill="none" stroke="#15223F" stroke-width="1.2"/><path d="M221.0,873.4 L210.0,868.4 L221.0,863.4" fill="none" stroke="#15223F" stroke-width="1.3"/><path d="M125.0,884.0 L125.0,923.0" fill="none" stroke="#15223F" stroke-width="1.2"/><path d="M130.0,912.0 L125.0,923.0 L120.0,912.0" fill="none" stroke="#15223F" stroke-width="1.3"/><circle cx="125.0" cy="78" r="12" fill="#15223F"/><rect x="46.0" y="130" width="158" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="125.0" y="153.1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Open the decision</text><text x="125.0" y="167.8" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">message</text><path d="M390.0,127 L495.0,166.0 L390.0,205 L285.0,166.0 Z" fill="#FFFFFF" stroke="#15223F" stroke-width="1.2"/><text x="390.0" y="156.7" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#15223F">[rejected or auto-deleted,</text><text x="390.0" y="170.1" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#15223F">first appeal, within 30</text><text x="390.0" y="183.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#15223F">days?]</text><rect x="46.0" y="239.2" width="158" height="52" rx="10" fill="#F1F1F3" stroke="#5A6472" stroke-width="1.2"/><text x="125.0" y="262.3" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">See why no appeal is</text><text x="125.0" y="277.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">possible</text><circle cx="125.0" cy="335.4" r="12.4" fill="#FFFFFF" stroke="#15223F" stroke-width="1.4"/><circle cx="125.0" cy="335.4" r="8" fill="#15223F"/><rect x="46.0" y="387.4" width="158" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="125.0" y="410.5" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Write reason, 20 to 2,000</text><text x="125.0" y="425.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">characters, and confirm</text><rect x="285.0" y="481.0" width="210" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="390.0" y="504.1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Create appeal, add to priority</text><text x="390.0" y="518.8" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">queue</text><rect x="565.0" y="481.0" width="200" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="665.0" y="504.1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Read content, original decision</text><text x="665.0" y="518.8" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">and reason</text><path d="M665.0,579.4 L729.0,608.4 L665.0,637.4 L601.0,608.4 Z" fill="#FFFFFF" stroke="#15223F" stroke-width="1.2"/><text x="665.0" y="612.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#15223F">[decision?]</text><rect x="280.0" y="660.4" width="220" height="62" rx="10" fill="#E3F4EE" stroke="#0F766E" stroke-width="1.2"/><text x="390.0" y="688.5" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Restore content, remove violation, lift</text><text x="390.0" y="703.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">penalty if now under the limit</text><rect x="280.0" y="754" width="220" height="52" rx="10" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.2"/><text x="390.0" y="784.4" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Set Permanently rejected</text><rect x="280.0" y="832" width="220" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="390.0" y="855.1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Append audit entry, commit, write</text><text x="390.0" y="869.8" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">outbox event</text><rect x="40.0" y="832" width="170" height="52" rx="10" fill="#EEF2F8" stroke="#15223F" stroke-width="1.2"/><text x="125.0" y="862.4" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#15223F">Receive the final decision</text><circle cx="125.0" cy="936" r="12.4" fill="#FFFFFF" stroke="#15223F" stroke-width="1.4"/><circle cx="125.0" cy="936" r="8" fill="#15223F"/></svg>