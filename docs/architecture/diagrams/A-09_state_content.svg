lvetica, sans-serif" font-size="12" text-anchor="start" fill="#15223F">purges it 90 days after removal unless an appeal is open. The author may also delete PendingReview content. A hidden or</text><text x="32.0" y="627.1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#15223F">deleted comment leaves a placeholder so that replies stay readable.</text></svg>